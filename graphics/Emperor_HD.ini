; Emperor Spice - Grafik-Preset "HD" (im Launcher: Grafikstil "HD")
; Dazu rendert dgVoodoo in doppelter Aufloesung (Supersampling, glatte Kanten). Das stellt der Launcher ein.
; Glamarye (Umgebungsverdeckung, braucht Tiefe) ist dabei, aber AUS: Im Test faerbte Fake GI alles gruen,
; und die Tiefen-Effekte verschmieren Seitenleiste und Kartenrand (Schleier). Wer es probieren will: im
; ReShade-Menue anhaken. In Menues schaltet Emperor Spice es automatisch aus.
; Tiefe: FAR_PLANE 1.5, nicht umgedreht (im Spiel mit DisplayDepth "Normal map" geprueft).
; Scroll Lock (Rollen) = alle Effekte an/aus, Ende = Tiefenpuffer anzeigen (Diagnose), Pos1 = ReShade-Menue
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1.5
Techniques=EmperorBloom@EmperorBloom.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=DisplayDepth@DisplayDepth.fx,Glamarye_Fast_Effects_with_Fake_GI@Glamayre_Fast_Effects.fx,EmperorBloom@EmperorBloom.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
KeyGlamarye_Fast_Effects_with_Fake_GI@Glamayre_Fast_Effects.fx=145,0,0,0
KeyEmperorBloom@EmperorBloom.fx=145,0,0,0
KeyCurves@Curves.fx=145,0,0,0
KeyVibrance@Vibrance.fx=145,0,0,0
KeyContrastAdaptiveSharpen@CAS.fx=145,0,0,0
KeyDisplayDepth@DisplayDepth.fx=35,0,0,0

[Glamayre_Fast_Effects.fx]
; Umgebungsverdeckung (weiche Schatten in Ecken, unter Gebaeuden) und indirektes Licht.
; Kantenglaettung macht jetzt dgVoodoo (Supersampling), Schaerfen macht CAS.
; Pixel mit Tiefe 0 oder 1 (HUD, Hintergrund) werden ausgelassen. Fake GI (gi_strength) auf 0, sonst wird alles gruen.
fxaa_enabled=0
sharp_enabled=0
ao_enabled=1
dof_enabled=0
depth_detect=1
sky_detect=1
ao_strength=0.850000
ao_shine_strength=0.400000
gi_strength=0.000000
gi_saturation=0.600000
gi_contrast=0.300000
gi_use_depth=1

[EmperorBloom.fx]
BloomThreshold=0.600000
BloomStrength=0.550000
BloomSaturation=1.100000

[Curves.fx]
Mode=0
Formula=4
Contrast=-0.100000

[Vibrance.fx]
Vibrance=0.200000
VibranceRGBBalance=1.000000,1.000000,1.000000

[CAS.fx]
Contrast=0.000000
Sharpening=0.800000
