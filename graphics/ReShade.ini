; ReShade settings shipped with Emperor Spice. Copied to the game's data folder on first use;
; ReShade itself updates this file when you change settings in its menu (Pos1 / Home key).
[GENERAL]
EffectSearchPaths=.\reshade-shaders\Shaders\**
TextureSearchPaths=.\reshade-shaders\Textures\**
PresetPath=.\Emperor_Modern.ini
PerformanceMode=1
NoReloadOnInit=0

[INPUT]
; Pos1 / Home = open the ReShade menu, Scroll Lock = effects on/off
KeyOverlay=36,0,0,0
KeyEffects=145,0,0,0

[OVERLAY]
TutorialProgress=4
ShowFPS=0
ShowClock=0

[SCREENSHOT]
SavePath=.\screenshots
