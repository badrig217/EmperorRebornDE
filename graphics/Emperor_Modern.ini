; ReShade-Preset fuer Emperor: Schlacht um Dune
; Benoetigt die Effektsammlungen "Standard effects" (fuer SMAA) und "SweetFX" (im ReShade-Installer auswaehlen).
; Ein/Aus im Spiel: Rollen-Taste (Scroll Lock), Menue: Pos1 (Home)

Techniques=SMAA@SMAA.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx
TechniqueSorting=SMAA@SMAA.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx
KeySMAA@SMAA.fx=145,0,0,0
KeyCurves@Curves.fx=145,0,0,0
KeyVibrance@Vibrance.fx=145,0,0,0
KeyLumaSharpen@LumaSharpen.fx=145,0,0,0

[SMAA.fx]
; Kantenglaettung als Nachbearbeitung (MSAA in dgVoodoo laesst das Spiel haengen)
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25

[Curves.fx]
; etwas mehr Kontrast gegen das flaue Bild
Mode=0
Formula=4
Contrast=0.180000

[Vibrance.fx]
; hebt vor allem wenig gesaettigte Farben (Gebaeude, Blau-Akzente),
; die ohnehin kraeftige Wueste bleibt fast unveraendert
Vibrance=0.120000
VibranceRGBBalance=1.000000,1.000000,1.000000

[LumaSharpen.fx]
; Nachschaerfen, gegen den weichen Eindruck der alten Texturen
sharp_strength=0.650000
sharp_clamp=0.035000
pattern=1
offset_bias=1.000000
show_sharpen=0
