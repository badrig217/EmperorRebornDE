; Emperor Spice - Grafik-Preset "HD" (Test 2: kraeftiger, Menues ohne Effekte)
; Scroll Lock (Rollen) = alle Effekte an/aus, Ende = Tiefenpuffer anzeigen (Diagnose), Pos1 = ReShade-Menue
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=0,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0
Techniques=Glamarye_Fast_Effects_with_Fake_GI@Glamayre_Fast_Effects.fx,EmperorBloom@EmperorBloom.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=DisplayDepth@DisplayDepth.fx,Glamarye_Fast_Effects_with_Fake_GI@Glamayre_Fast_Effects.fx,EmperorBloom@EmperorBloom.fx,Curves@Curves.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
KeyGlamarye_Fast_Effects_with_Fake_GI@Glamayre_Fast_Effects.fx=145,0,0,0
KeyEmperorBloom@EmperorBloom.fx=145,0,0,0
KeyCurves@Curves.fx=145,0,0,0
KeyVibrance@Vibrance.fx=145,0,0,0
KeyContrastAdaptiveSharpen@CAS.fx=145,0,0,0
KeyDisplayDepth@DisplayDepth.fx=35,0,0,0

[Glamayre_Fast_Effects.fx]
; Umgebungsverdeckung (weiche Schatten in Ecken, unter Gebaeuden) und indirektes Licht.
; Kantenglaettung macht jetzt dgVoodoo (Supersampling), Schaerfen macht CAS.
; Menues/HUD (Tiefe 0 oder 1) werden ausgelassen, sonst wird das Menue schwarz
fxaa_enabled=0
sharp_enabled=0
ao_enabled=1
dof_enabled=0
depth_detect=1
sky_detect=1
ao_strength=0.850000
ao_shine_strength=0.400000
gi_strength=0.650000
gi_saturation=0.600000
gi_contrast=0.300000
gi_use_depth=1

[EmperorBloom.fx]
BloomThreshold=0.600000
BloomStrength=0.550000
BloomSaturation=1.100000

[Curves.fx]
Mode=0
Formula=4
Contrast=0.200000

[Vibrance.fx]
Vibrance=0.200000
VibranceRGBBalance=1.000000,1.000000,1.000000

[CAS.fx]
Contrast=0.000000
Sharpening=0.800000
